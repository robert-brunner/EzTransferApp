<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Transfer</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 480px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h2 { color: #333; }
        input[type=file] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            background: #0078d4;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:disabled { background: #aaa; }
        #status { margin-top: 16px; font-weight: bold; font-size: 16px; }
        #fileList { margin-top: 10px; color: #444; line-height: 1.8; }
    </style>
</head>
<body>
    <h1>Hello World!</h1>
    <h2>📁 Send Files to PC</h2>
    <h2>C\Users\[YourComputerName]\Pictures\From Phone</h2>
    <input type="file" id="fileInput" multiple>
    <button id="uploadBtn">Upload</button>
    <div id="status"></div>
    <div id="fileList"></div>

    <script>
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('fileInput');
            const statusDiv = document.getElementById('status');
            const fileListDiv = document.getElementById('fileList');
            const btn = document.getElementById('uploadBtn');

            if (fileInput.files.length === 0) {
                statusDiv.innerHTML = "❌ Select at least one file first.";
                return;
            }

            const files = fileInput.files;
            statusDiv.innerHTML = `⏳ Uploading 0 of ${files.length}...`;
            fileListDiv.innerHTML = '';
            btn.disabled = true;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                statusDiv.innerHTML = `⏳ Uploading ${i + 1} of ${files.length}: ${file.name}`;

                try {
                    const response = await fetch('/upload', {
                        method: 'POST',
                        headers: { 'file-name': encodeURIComponent(file.name) },
                        body: file
                    });

                    if (response.ok) {
                        fileListDiv.innerHTML += `✅ ${file.name}<br>`;
                    } else {
                        fileListDiv.innerHTML += `❌ Failed: ${file.name}<br>`;
                    }
                } catch (err) {
                    fileListDiv.innerHTML += `❌ Error: ${file.name} — ${err.message}<br>`;
                }
            }

            statusDiv.innerHTML = "✨ Done!";
            btn.disabled = false;
        });
    </script>

    <p style="font-size: 10px; font-style: italic; color: #777;">There is no escape from this because there is no outside...</p>

</body>
</html>
